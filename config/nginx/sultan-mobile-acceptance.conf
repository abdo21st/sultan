limit_req_zone $binary_remote_addr zone=sultan_mobile_auth:1m rate=10r/m;

server {
    listen 80;
    server_name sultan-qa.mtapp.ly;
    access_log /var/log/nginx/sultan-mobile-acceptance.access.log combined;
    error_log /var/log/nginx/sultan-mobile-acceptance.error.log error;
    return 301 https://sultan-qa.mtapp.ly$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sultan-qa.mtapp.ly;
    access_log /var/log/nginx/sultan-mobile-acceptance.access.log combined;
    error_log /var/log/nginx/sultan-mobile-acceptance.error.log error;
    ssl_certificate /etc/letsencrypt/live/mtapp.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtapp.ly/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /manifest.json {
        alias /var/www/sultan-mobile-acceptance/manifest.json;
        default_type application/manifest+json;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /api/auth/callback/credentials {
        limit_req zone=sultan_mobile_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3375;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:3375;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
