services:
  sultan-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sultan-web-app
    restart: always
    networks:
      - sultan-private-net
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://sultan_user:${DB_PASSWORD:?Set DB_PASSWORD in the ignored local environment file}@sultan-db:5432/sultan_db"
      DIRECT_URL: "postgresql://sultan_user:${DB_PASSWORD:?Set DB_PASSWORD in the ignored local environment file}@sultan-db:5432/sultan_db"
    depends_on:
      sultan-db:
        condition: service_healthy
      sultan-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sultan-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: sultan-db-migrate
    restart: "no"
    networks:
      - sultan-private-net
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://sultan_user:${DB_PASSWORD:?Set DB_PASSWORD in the ignored local environment file}@sultan-db:5432/sultan_db"
      DIRECT_URL: "postgresql://sultan_user:${DB_PASSWORD:?Set DB_PASSWORD in the ignored local environment file}@sultan-db:5432/sultan_db"
    depends_on:
      sultan-db:
        condition: service_healthy

  sultan-db:
    image: postgres:15-alpine
    container_name: sultan-postgres-db
    restart: always
    environment:
      - POSTGRES_DB=sultan_db
      - POSTGRES_USER=sultan_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the ignored local environment file}
    networks:
      - sultan-private-net
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sultan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sultan_user -d sultan_db"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  sultan-private-net:
    name: sultan_isolated_network
    driver: bridge

volumes:
  sultan_db_data:
    name: sultan_persistent_storage
