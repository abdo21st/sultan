<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#b45309">
    <title>سلطان | دون اتصال</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f8fafc; color: #18181b; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #e4e4e7; border-radius: 16px; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: 1.35rem; }
      p { line-height: 1.8; color: #52525b; }
      button { min-height: 44px; margin-top: 12px; padding: 0 18px; border: 0; border-radius: 10px; background: #b45309; color: #fff; font: inherit; cursor: pointer; }
      button:disabled { background: #a1a1aa; cursor: wait; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تعذر فتح هذه الصفحة. الطلبات المحفوظة على هذا الجهاز تبقى محلية حتى يعود الاتصال، ثم يحاول التطبيق مزامنتها بعد فتحه.</p>
      <p id="status" role="status" aria-live="polite">بانتظار عودة الاتصال.</p>
      <button id="retry" type="button" disabled>إعادة المحاولة</button>
    </main>
    <script>
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      const updateConnection = () => {
        if (navigator.onLine) {
          status.textContent = "عاد الاتصال. سيُفتح التطبيق لمزامنة الطلبات المحفوظة.";
          retry.disabled = false;
          window.setTimeout(() => window.location.reload(), 700);
        } else {
          status.textContent = "بانتظار عودة الاتصال.";
          retry.disabled = true;
        }
      };
      retry.addEventListener("click", () => window.location.reload());
      window.addEventListener("online", updateConnection);
      window.addEventListener("offline", updateConnection);
      updateConnection();
    </script>
  </body>
</html>
